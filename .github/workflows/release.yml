name: release

on:
  workflow_dispatch:
    inputs:
      target_release_tag:
        description: Git tag for this release (for example v0.8.0)
        type: string
        required: true

env:
  IS_THIS_RELEASE: true
  TARGET_MC_VERSIONS: 26.1,26.3
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.target_release_tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Minecraft 26.1.2 and 26.3 clients and the 26.1.2 server companion
        run: ./gradlew :26.1:build :26.3:build :serverCompanion:build --stacktrace --console=plain

      - name: Build Minecraft 26.3 server companion
        run: ./gradlew :serverCompanion:build -Pserver_mc=26.3 --stacktrace --console=plain

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release-artifacts
          find versions/26.1/build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-sources.jar" -exec cp {} release-artifacts/ \;
          find versions/26.3/build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-sources.jar" -exec cp {} release-artifacts/ \;
          find serverCompanion/build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-sources.jar" -exec cp {} release-artifacts/ \;
          test "$(find release-artifacts -maxdepth 1 -type f -name '*.jar' | wc -l)" -eq 4
          cd release-artifacts
          sha256sum *.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          VERSION="${{ inputs.target_release_tag }}"
          VERSION="${VERSION#v}"
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "::warning::Could not extract section for $VERSION from CHANGELOG.md, falling back to full changelog header"
            head -n 40 CHANGELOG.md > release-body.md
          fi
          echo "--- release-body.md ---"
          cat release-body.md

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.target_release_tag }}
          name: ${{ inputs.target_release_tag }}
          body_path: release-body.md
          files: |
            release-artifacts/*.jar
            release-artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
